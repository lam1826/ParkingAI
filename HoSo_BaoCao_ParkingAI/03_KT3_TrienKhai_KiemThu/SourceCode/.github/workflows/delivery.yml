name: Continuous Delivery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Optional main commit to deploy; defaults to current main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: parkingai-fly-production
  cancel-in-progress: false

env:
  FLY_APP: parkingai-api-lam1826
  PUBLIC_API_URL: https://api.parkingai.am

jobs:
  build-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit_sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Resolve immutable release commit
        id: resolve
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
        run: |
          sha="${WORKFLOW_SHA:-${MANUAL_SHA:-}}"
          if [ -z "$sha" ]; then sha="${GITHUB_SHA}"; fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid release SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Require release commit to belong to main
        env:
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend against the public API domain
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.PUBLIC_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Upload immutable frontend build evidence
        uses: actions/upload-artifact@v4
        with:
          name: parkingai-frontend-${{ steps.resolve.outputs.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RELEASE_SHA: ${{ needs.build-release.outputs.commit_sha }}

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-release.outputs.commit_sha }}

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend and migrate Supabase schema
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy
          --remote-only
          --app "$FLY_APP"
          --config fly.toml
          --env "RELEASE_ID=$RELEASE_SHA"
          --strategy rolling
          --release-command-timeout 10m
          --wait-timeout 10m
          --yes

      - name: Verify release, readiness, and browser CORS
        run: |
          ready_url="$PUBLIC_API_URL/ready"
          root_url="$PUBLIC_API_URL/"
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$ready_url" >/tmp/parkingai-ready.json
          python -c \
            'import json; assert json.load(open("/tmp/parkingai-ready.json", encoding="utf-8"))["status"] == "ready"'
          echo "Readiness verified: ready"

          ACTUAL_RELEASE=""
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              "$root_url" >/tmp/parkingai-root.json
            ACTUAL_RELEASE="$(python -c \
              'import json; print(json.load(open("/tmp/parkingai-root.json", encoding="utf-8"))["release_id"])')"
            if [ "$ACTUAL_RELEASE" = "$RELEASE_SHA" ]; then
              break
            fi
            echo "Waiting for release propagation ($attempt/12): got $ACTUAL_RELEASE"
            sleep 5
          done
          if [ "$ACTUAL_RELEASE" != "$RELEASE_SHA" ]; then
            echo "::error::Release verification failed: expected $RELEASE_SHA, got $ACTUAL_RELEASE"
            exit 1
          fi
          echo "Release verified: $ACTUAL_RELEASE"

          curl --fail --silent --show-error \
            --request OPTIONS \
            --header 'Origin: https://parkingai.am' \
            --header 'Access-Control-Request-Method: GET' \
            --dump-header /tmp/parkingai-cors.txt \
            --output /dev/null \
            "$PUBLIC_API_URL/api/v1/zones"
          tr -d '\r' </tmp/parkingai-cors.txt \
            >/tmp/parkingai-cors-normalized.txt
          if ! grep -Eiq '^access-control-allow-origin: https://parkingai\.am$' \
            /tmp/parkingai-cors-normalized.txt; then
            echo "::error::CORS verification failed for https://parkingai.am"
            grep -Ei '^(HTTP/|access-control-)' \
              /tmp/parkingai-cors-normalized.txt || true
            exit 1
          fi
          echo "CORS verified: https://parkingai.am"

      - name: Record Fly deployment status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl status --app "$FLY_APP"
