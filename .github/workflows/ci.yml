name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parkingai_test
          POSTGRES_PASSWORD: parkingai_test
          POSTGRES_DB: parkingai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkingai_test -d parkingai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify source snapshot parity
        run: python scripts/sync_source_snapshot.py --check

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        id: backend-tests
        continue-on-error: true
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Report backend test failures
        if: steps.backend-tests.outcome == 'failure'
        run: python scripts/report_pytest_failures.py pytest-results.xml

      - name: Migrate PostgreSQL test database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://parkingai_test:parkingai_test@127.0.0.1:5432/parkingai_test
        run: alembic -c alembic.ini upgrade head

      - name: Run PostgreSQL integration tests
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://parkingai_test:parkingai_test@127.0.0.1:5432/parkingai_test
        run: python -m pytest tests/test_postgres_integration.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  release-safety-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run Windows rollout safety tests
        run: python -m pytest tests/test_release_safety.py -q
