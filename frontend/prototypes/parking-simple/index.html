      }
      fields += input(app, 'startDate', 'Ngày bắt đầu', draft.startDate, 'type="date" min="2020-01-01" max="2099-12-31" required')
        + input(app, 'endDate', 'Ngày kết thúc (bao gồm cả ngày)', draft.endDate, 'type="date" min="2020-01-01" max="2099-12-31" required')
        + input(app, 'price', 'Giá kỳ vé · đồng', draft.price, 'type="number" min="0" max="1000000000" step="1" required')
        + (kind === 'pass' ? checked('active', 'Kỳ vé hoạt động', draft.active) : '');
      note = 'Cấp/gia hạn ghi phiếu thu mô phỏng theo giá kỳ vé. Xe phải có hồ sơ liên kết đúng khách. Quyền lợi vé tháng được chốt khi nhận xe; sửa vé không viết lại phí của lượt cũ.';
    }
    return `<section class="surface core-editor" aria-labelledby="core-form-title"><div class="section-head"><h2 id="core-form-title">${kind === 'renewal' ? 'Gia hạn vé tháng' : `${draft.id || draft.originalCode ? 'Sửa' : 'Thêm'} ${kinds[kind]}`}</h2></div>
      <form data-action="core-save" class="form-grid"><input type="hidden" name="kind" value="${kind}"><input type="hidden" name="id" value="${app.esc(draft.id || '')}">${fields}
      ${note ? `<p class="inline-note core-wide">${note}</p>` : ''}
      ${app.ui.coreError ? `<p class="form-error core-wide" role="alert">${app.esc(app.ui.coreError)}</p>` : ''}
      <div class="form-actions core-wide"><button type="submit" class="button primary">${kind === 'renewal' ? 'Lưu kỳ gia hạn' : 'Lưu thay đổi'}</button>${button(app, 'close', 'Hủy', {}, 'secondary')}</div></form></section>`;
  }

  function lot(app) {
    if (!internal(app)) return '<div class="empty">Mục này dành cho bộ phận vận hành.</div>';
    const view = app.ui.coreLotTab === 'zones' ? 'zones' : 'slots';
    const filter = app.ui.coreLotFilter || { zone: '', status: '' };
    const allSlots = rows(app, 'slots');
    const filtered = allSlots.filter(slot => (!filter.zone || slot.zoneId === filter.zone) && (!filter.status || E.slotStatus(app.state, slot) === filter.status));
    const totals = allSlots.reduce((sum, slot) => { sum[E.slotStatus(app.state, slot)] += 1; return sum; }, { available: 0, occupied: 0, reserved: 0, inactive: 0 });
    let content;
    if (view === 'zones') {
      content = `<section class="surface"><div class="section-head"><h2>Các khu vực</h2></div>${table(['Khu vực', 'Loại xe', 'Vị trí / sức chứa', 'Còn nhận xe', 'Trạng thái', 'Thao tác'], zones(app).map(zone => {
        const slots = allSlots.filter(slot => slot.zoneId === zone.id);
        return `<tr><td><strong>${app.esc(zone.name)}</strong></td><td>${app.esc(typeName(app, zone.vehicleType))}</td><td>${slots.length} / ${zone.capacity}</td><td>${slots.filter(slot => E.slotStatus(app.state, slot) === 'available').length}</td><td>${badge(app, zone.active)}</td><td>${actions(app, 'zone', zone.id, true)}</td></tr>`;
      }), 'Chưa có khu vực. Thêm khu trước, sau đó thêm vị trí đỗ.')}</section>`;
    } else {
      content = `<section class="surface"><form class="core-filter form-grid" data-action="core-filter-lot">${select(app, 'zone', 'Khu vực', filter.zone, [['', 'Tất cả khu vực'], ...zones(app).map(zone => [zone.id, zone.name])], false)}${select(app, 'status', 'Tình trạng vị trí', filter.status, [['', 'Tất cả trạng thái'], ...Object.entries(stateLabel)], false)}<div class="form-actions core-wide"><button type="submit" class="button secondary">Lọc vị trí</button>${button(app, 'reset-lot', 'Xóa bộ lọc')}</div></form></section>
        ${zones(app).filter(zone => !filter.zone || zone.id === filter.zone).map(zone => {
          const slots = filtered.filter(slot => slot.zoneId === zone.id);
          if (!slots.length) return '';
          return `<section class="surface core-zone"><div class="section-head"><div><h2>${app.esc(zone.name)}</h2><p>${app.esc(typeName(app, zone.vehicleType))} · ${slots.length} vị trí trong bộ lọc</p></div></div><div class="availability-grid core-slot-grid">${slots.map(slot => {
            const status = E.slotStatus(app.state, slot);
            return `<div class="slot ${status === 'reserved' ? 'held' : status}"><strong>${app.esc(slot.code)}</strong><span>${stateLabel[status]}</span>${manage(app) ? button(app, 'open', 'Sửa', { kind: 'slot', id: slot.code }) : ''}</div>`;
          }).join('')}</div></section>`;
        }).join('') || '<section class="surface"><div class="empty">Không có vị trí phù hợp. Đổi bộ lọc hoặc thêm vị trí mới.</div></section>'}
        <details class="surface core-details"><summary>Danh sách vị trí & thao tác</summary>${table(['Vị trí', 'Khu vực', 'Loại xe', 'Trạng thái', 'Thao tác'], filtered.map(slot => `<tr><td>${app.esc(slot.code)}</td><td>${app.esc(zones(app).find(zone => zone.id === slot.zoneId)?.name || '—')}</td><td>${app.esc(typeName(app, slot.vehicleType))}</td><td>${stateLabel[E.slotStatus(app.state, slot)]}</td><td>${actions(app, 'slot', slot.code, true)}</td></tr>`), 'Không có vị trí phù hợp.')}</details>`;
    }
    return `${heading(app, 'Bãi đỗ', 'Quản lý khu vực, chỗ đỗ và khả năng nhận xe tại một bãi.', view === 'zones' ? 'zone' : 'slot')}${tabs(app, 'lot', view, [['slots', 'Vị trí đỗ'], ['zones', 'Khu vực']])}${notice(app)}
      <div class="stat-strip"><span class="stat-item"><strong>${totals.available}</strong>còn nhận xe</span><span class="stat-item"><strong>${totals.occupied}</strong>đang có xe</span><span class="stat-item"><strong>${totals.reserved}</strong>giữ chỗ</span><span class="stat-item"><strong>${totals.inactive}</strong>ngừng phục vụ</span></div>
      ${form(app, view === 'zones' ? ['zone'] : ['slot'])}${content}`;
  }

  function catalog(app) {
    if (!internal(app)) return '<div class="empty">Mục này dành cho bộ phận vận hành.</div>';
    return `${heading(app, 'Loại xe & bảng giá', 'Danh mục phương tiện và đơn giá theo giờ. Manager và Admin đều có thể quản lý.', 'type')}${notice(app)}${form(app, ['type'])}
      <section class="surface">${table(['Loại xe', 'Nhận dạng', 'Giá / giờ', 'Trạng thái', 'Thao tác'], types(app).map(type => `<tr><td><strong>${app.esc(type.label)}</strong><div class="muted">Mã vị trí ${app.esc(type.prefix)}</div></td><td>${type.requiresPlate ? 'Biển số' : 'Mã xe / mã vé'}</td><td>${app.money(app.state.rates[type.id])}</td><td>${badge(app, type.active)}</td><td>${actions(app, 'type', type.id, true)}</td></tr>`), 'Chưa có loại xe.')}
      <p class="inline-note">Lượt đang gửi giữ đơn giá đã nhận lúc vào. Loại xe mới bắt đầu với 0 chỗ: thêm khu và vị trí trong mục Bãi đỗ. Loại đang được tham chiếu không được xóa.</p></section>`;
  }

  function reception(app) {
    return `<section class="surface"><div class="section-head"><h2>Đặt chỗ của khách</h2><span class="muted">${rows(app, 'reservations').length} yêu cầu</span></div>${table(['Biển số / mã xe', 'Vị trí', 'Khung giờ', 'Trạng thái'], rows(app, 'reservations').map(item => `<tr><td>${app.esc(item.plate)}<div class="muted">${app.esc(typeName(app, item.vehicleType))}</div></td><td>${app.esc(item.slot)}</td><td>${stamp(app, item.start)}<br>${stamp(app, item.end)}</td><td><span class="badge ${item.status === 'confirmed' ? 'success' : 'neutral'}">${reservationLabel[item.status] || app.esc(item.status)}</span></td></tr>`), 'Chưa có đặt chỗ. Khách có thể đặt ở giao diện Customer.')}
      <p class="inline-note">Khi xe đến, vào mục Vận hành để nhận xe theo biển số. Khách tự tạo hoặc hủy đặt chỗ trong giao diện của mình.</p></section>
      <section class="surface"><div class="section-head"><h2>Yêu cầu hỗ trợ</h2></div>${table(['Thời gian', 'Chủ đề', 'Nội dung', 'Trạng thái'], rows(app, 'support').map(item => `<tr><td>${stamp(app, item.at)}</td><td>${app.esc(item.subject)}</td><td class="core-long-text">${app.esc(item.message)}</td><td>${item.status === 'open' ? 'Đang tiếp nhận' : app.esc(item.status)}</td></tr>`), 'Chưa có yêu cầu hỗ trợ trong phiên demo.')}</section>`;
  }

  function customers(app) {
    if (!internal(app)) return '<div class="empty">Mục này dành cho bộ phận vận hành.</div>';
    const choices = [['customers', 'Khách hàng'], ['vehicles', 'Phương tiện'], ['passes', 'Vé tháng'], ['reception', 'Tiếp nhận']];
    const view = choices.some(([key]) => key === app.ui.coreCustomerTab) ? app.ui.coreCustomerTab : 'customers';
    const kind = { customers: 'customer', vehicles: 'vehicle', passes: 'pass' }[view];
    let content;
    if (view === 'reception') content = reception(app);
    else if (view === 'customers') content = `<section class="surface">${table(['Khách hàng', 'Liên hệ', 'Xe liên kết', 'Trạng thái', 'Thao tác'], rows(app, 'customers').map(item => `<tr><td><strong>${app.esc(item.name)}</strong><div class="muted">${app.esc(item.id)}</div></td><td>${app.esc(item.phone)}<div class="muted">${app.esc(item.email || '—')}</div></td><td>${rows(app, 'vehicles').filter(vehicle => vehicle.customerId === item.id).length}</td><td>${badge(app, item.active)}</td><td>${actions(app, 'customer', item.id)}</td></tr>`), 'Chưa có khách hàng. Thêm hồ sơ để liên kết phương tiện và cấp vé tháng.')}</section>`;
    else if (view === 'vehicles') content = `<section class="surface">${table(['Biển số / mã xe', 'Loại xe', 'Khách hàng', 'Trạng thái', 'Thao tác'], rows(app, 'vehicles').map(item => `<tr><td><strong>${app.esc(item.plate)}</strong></td><td>${app.esc(typeName(app, item.vehicleType))}</td><td>${app.esc(customerName(app, item.customerId))}</td><td>${badge(app, item.active)}</td><td>${actions(app, 'vehicle', item.id)}</td></tr>`), 'Chưa có phương tiện liên kết. Thêm hồ sơ khách trước.')}</section>`;
    else content = `<section class="surface">${table(['Vé / xe', 'Khách hàng', 'Thời hạn', 'Giá kỳ vé', 'Trạng thái', 'Thao tác'], rows(app, 'monthlyPasses').map(item => {
      const status = E.passStatus(app.state, item);
      return `<tr><td><strong>${app.esc(item.plate)}</strong><div class="muted">${app.esc(item.id)} · ${app.esc(typeName(app, item.vehicleType))}</div></td><td>${app.esc(customerName(app, item.customerId))}</td><td>${dateLabel(item.startDate)}<br>đến hết ${dateLabel(item.endDate)}</td><td>${app.money(item.price)}</td><td><span class="badge ${status.key === 'active' ? 'success' : status.key === 'upcoming' ? 'warning' : 'neutral'}">${app.esc(status.label)}</span></td><td><div class="core-row-actions">${actions(app, 'pass', item.id)}${manage(app) ? button(app, 'open', 'Gia hạn', { kind: 'renewal', id: item.id }) : ''}</div></td></tr>`;
    }), 'Chưa có vé tháng. Thêm khách hàng và phương tiện trước khi cấp vé.')}
      <p class="inline-note">Vé có hiệu lực đến hết ngày kết thúc theo giờ Việt Nam. Ngừng vé bằng thao tác Sửa; các kỳ đã sử dụng và chứng từ vẫn được giữ.</p></section>`;
    return `${heading(app, 'Khách & vé', 'Hồ sơ khách, phương tiện liên kết và các kỳ vé tháng.', kind)}${tabs(app, 'customers', view, choices)}${notice(app)}${form(app, view === 'passes' ? ['pass', 'renewal'] : kind ? [kind] : [])}${content}`;
  }

  function history(app) {
    if (!internal(app)) return '<div class="empty">Mục này dành cho bộ phận vận hành.</div>';
    const filter = app.ui.coreHistoryFilter || {};
    const found = rows(app, 'sessions').filter(session => (!filter.query || E.normalize(session.plate).includes(E.normalize(filter.query)) || E.normalize(session.ticket).includes(E.normalize(filter.query)) || E.normalize(session.id).includes(E.normalize(filter.query)))
      && (!filter.vehicleType || session.vehicleType === filter.vehicleType) && (!filter.status || session.status === filter.status)
      && (!filter.from || dayOf(session.entry) >= filter.from) && (!filter.to || dayOf(session.entry) <= filter.to))
      .slice().sort((left, right) => new Date(right.entry) - new Date(left.entry));
    return `${heading(app, 'Tra cứu lượt gửi', 'Tìm toàn bộ lượt đang gửi và đã kết thúc theo biển số, mã vé hoặc ngày vào.')}
      <section class="surface"><form data-action="core-filter-history" class="form-grid core-history-filter">
      ${input(app, 'query', 'Biển số / mã xe / mã vé', filter.query, 'maxlength="40" placeholder="59A-123.45 hoặc VE-2048"')}
      ${select(app, 'vehicleType', 'Loại xe', filter.vehicleType, [['', 'Tất cả loại xe'], ...types(app).map(type => [type.id, type.label])], false)}
      ${input(app, 'from', 'Ngày vào từ', filter.from, 'type="date"')}${input(app, 'to', 'Ngày vào đến (bao gồm cả ngày)', filter.to, 'type="date"')}
      ${select(app, 'status', 'Trạng thái lượt gửi', filter.status, [['', 'Tất cả'], ...Object.entries(sessionLabel)], false)}
      <div class="form-actions"><button type="submit" class="button primary">${app.icon('search')} Tra cứu</button>${button(app, 'reset-history', 'Xóa bộ lọc')}</div>
      ${app.ui.coreHistoryError ? `<p class="form-error core-wide" role="alert">${app.esc(app.ui.coreHistoryError)}</p>` : ''}</form></section>
      <section class="surface"><div class="section-head"><h2>Kết quả tra cứu</h2><span class="muted">${found.length} lượt</span></div>
      ${table(['Xe / mã vé', 'Vị trí', 'Giờ vào', 'Giờ ra', 'Thời gian', 'Phí / đã trả', 'Trạng thái', 'Chi tiết'], found.map(session => {
        const quote = E.quote(app.state, session);
        return `<tr><td><strong>${app.esc(session.plate)}</strong><div class="muted">${app.esc(session.ticket)}</div></td><td>${app.esc(session.slot)}</td><td>${stamp(app, session.entry)}</td><td>${stamp(app, session.exit)}</td><td>${duration(quote.minutes)}</td><td>${app.money(quote.gross)}<div class="muted">Đã trả ${app.money(quote.paid)}</div></td><td><span class="badge ${session.status === 'active' ? 'warning' : 'neutral'}">${sessionLabel[session.status] || app.esc(session.status)}</span></td><td>${button(app, 'detail', 'Xem', { id: session.id })}</td></tr>`;
      }), 'Không có lượt gửi phù hợp. Thử đổi biển số, thời gian hoặc trạng thái.')}</section>`;
  }

  function detail(app, id) {
    const session = rows(app, 'sessions').find(item => item.id === id);
    if (!session) return app.notify('Không tìm thấy lượt gửi này.');
    const quote = E.quote(app.state, session);
    const payments = rows(app, 'transactions').filter(payment => payment.sessionId === session.id);
    const facts = [['Mã vé', session.ticket], ['Loại xe', typeName(app, session.vehicleType)], ['Vị trí', session.slot],
      ['Giờ vào', stamp(app, session.entry)], ['Giờ ra', stamp(app, session.exit)], ['Thời gian gửi', duration(quote.minutes)],
      ['Đơn giá lúc vào', `${app.money(quote.rate ?? session.rateSnapshot)} / giờ`], ['Tổng phí lượt', app.money(quote.gross)], ['Đã thanh toán', app.money(quote.paid)], ['Còn thanh toán', app.money(quote.due)]];
    let content = `<span class="badge ${session.status === 'active' ? 'warning' : 'neutral'}">${sessionLabel[session.status] || app.esc(session.status)}</span><dl class="definition-list core-facts">${facts.map(([label, value]) => `<div><dt>${label}</dt><dd>${app.esc(value)}</dd></div>`).join('')}</dl>`;
    if (quote.monthlyPassId) content += `<p class="inline-note">Áp dụng vé tháng ${app.esc(quote.monthlyPassId)} từ ${stamp(app, quote.coverageStart)} đến ${stamp(app, quote.coverageEnd)}. Được bao phủ ${duration(quote.coveredMinutes || 0)}; thời gian tính phí ${duration(quote.billableMinutes || 0)}.</p>`;
    content += `<h3>Thanh toán của lượt</h3>${payments.length ? payments.map(payment => `<div class="history-row"><div>${app.esc(payment.id)}<small>${stamp(app, payment.at)} · ${payment.method === 'cash' ? 'Tiền mặt' : 'Online'} mô phỏng</small></div><strong>${app.money(payment.amount)}</strong></div>`).join('') : '<p class="muted core-empty-note">Chưa có phiếu thu cho lượt này.</p>'}<div class="form-actions">${button(app, 'close-detail', 'Đóng', {}, 'secondary')}</div>`;
    app.showModal(`Lượt gửi ${app.esc(session.plate)}`, content);
  }

  function handle(app, action, data) {
    if (!internal(app)) { app.notify('Mục này dành cho bộ phận vận hành.'); return false; }
    if (action === 'core-tab') {
      const page = read(data, 'page'), value = read(data, 'value');
      if (page === 'lot' && ['slots', 'zones'].includes(value)) app.ui.coreLotTab = value;
      else if (page === 'customers' && ['customers', 'vehicles', 'passes', 'reception'].includes(value)) app.ui.coreCustomerTab = value;
      app.render(); return true;
    }
    if (action === 'core-close-detail') { app.closeModal(); return true; }
    if (action === 'core-detail') { detail(app, read(data, 'id')); return true; }
    if (action === 'core-reset-history') { app.ui.coreHistoryFilter = {}; app.ui.coreHistoryError = ''; app.render(); return true; }
    if (action === 'core-reset-lot') { app.ui.coreLotFilter = {}; app.render(); return true; }
    if (action === 'core-filter-lot') { app.ui.coreLotFilter = { zone: read(data, 'zone'), status: read(data, 'status') }; app.render(); return true; }
    if (action === 'core-filter-history') {
      const filter = Object.fromEntries(['query', 'vehicleType', 'from', 'to', 'status'].map(key => [key, read(data, key)]));
      app.ui.coreHistoryFilter = filter;
      app.ui.coreHistoryError = filter.from && filter.to && filter.from > filter.to ? 'Ngày kết thúc phải bằng hoặc sau ngày bắt đầu.' : '';
      app.render(); return !app.ui.coreHistoryError;
    }
    if (!manage(app)) { app.notify('Manager hoặc Admin mới được thay đổi dữ liệu này.'); return false; }
    if (action === 'core-close') { app.ui.coreForm = ''; app.ui.coreError = ''; app.render(); return true; }
    if (action === 'core-open') {
      const kind = read(data, 'kind'), id = read(data, 'id');
      if (!Object.hasOwn(fieldLists, kind)) return false;
      app.ui.coreForm = kind; app.ui.coreDraft = initialDraft(app, kind, id); app.ui.coreError = '';
      app.render();
      document.querySelector('.core-editor input:not([type=hidden]),.core-editor select')?.focus();
      return true;
    }
    if (action === 'core-save') {
      const kind = read(data, 'kind');
      if (!Object.hasOwn(fieldLists, kind) || app.ui.coreForm !== kind) return false;
      const draft = Object.fromEntries(fieldLists[kind].map(key => [key, read(data, key)]));
      for (const key of ['active', 'requiresPlate']) if (fieldLists[kind].includes(key)) draft[key] = draft[key] === 'true';
      app.ui.coreDraft = draft;
      const payload = { ...draft };
      for (const key of ['capacity', 'rate', 'price']) if (Object.hasOwn(payload, key)) payload[key] = Number(payload[key]);
      if (kind === 'slot') payload.vehicleType = zones(app).find(zone => zone.id === payload.zoneId)?.vehicleType || '';
      const operation = { zone: 'save-zone', slot: 'save-slot', type: 'save-vehicle-type', customer: 'save-customer', vehicle: 'save-vehicle', pass: 'save-pass', renewal: 'renew-pass' }[kind];
      const result = E.apply(app.state, { type: operation, ...payload, role: app.ui.role });
      if (result.ok) { app.state = result.state; app.ui.coreForm = ''; app.ui.coreDraft = null; app.ui.coreError = ''; }
      else app.ui.coreError = result.message;
      app.render(); app.notify(result.message); return result.ok;
    }
    if (action === 'core-delete') {
      const kind = read(data, 'kind'), id = read(data, 'id');
      if (!['zone', 'slot', 'type'].includes(kind)) return false;
      const item = recordFor(app, kind, id);
      if (!item) return false;
      const label = item.name || item.label || item.code;
      app.showModal(`Xóa ${kinds[kind]}`, `<p>Bạn muốn xóa <strong>${app.esc(label)}</strong>?</p><p class="inline-note">Chỉ xóa khi không còn dữ liệu tham chiếu. Nếu đã dùng, hãy chuyển sang ngừng hoạt động để giữ lịch sử.</p><div class="form-actions">${button(app, 'confirm-delete', 'Xóa', { kind, id }, 'danger')}${button(app, 'close-detail', 'Giữ lại', {}, 'secondary')}</div>`);
      return true;
    }
    if (action === 'core-confirm-delete') {
      const kind = read(data, 'kind'), id = read(data, 'id');
      if (!['zone', 'slot', 'type'].includes(kind)) return false;
      const result = E.apply(app.state, { type: { zone: 'delete-zone', slot: 'delete-slot', type: 'delete-vehicle-type' }[kind], id, code: id, role: app.ui.role });
      if (result.ok) app.state = result.state;
      app.closeModal(); app.render(); app.notify(result.message); return result.ok;
    }
    return false;
  }

  window.DemoCore = { lot, catalog, customers, history, handle };
}());
</script>
  <script>/* Prototype, in-memory only. */
/* source: auth.js */
/* Preview authentication only. No network, secrets or security boundary. */
(() => {
  'use strict';
  const labels = {admin:'Admin',manager:'Manager',staff:'Nhân viên',customer:'Customer'};
  const read = (data,key) => String(typeof data?.get === 'function' ? data.get(key) || '' : data?.[key] || '').trim();
  function render(app) {
    const draft=app.ui.loginDraft || {username:'manager_demo',password:''};

    app.state.audit.unshift({at:app.state.now,text:'Đăng nhập mô phỏng: '+user.username+' ('+labels[user.role]+').'});
    app.notify('Đã vào giao diện '+labels[user.role]+'.');return true;
  }
  window.DemoAuth={render,profile,handle};
})();
</script>

/* Role-scoped, deterministic sample assistant. No network or real LLM. */
(() => {
  'use strict';
  const E = window.DemoEngine;
  const A = window.DemoAnalytics;
  const histories = { customer: [], staff: [], manager: [], admin: [] };
  const drafts = { customer: '', staff: '', manager: '', admin: '' };
  let open = false;
  const robot = '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="18" height="15" rx="5"/><path d="M14 8V4m-2 0h4M2 13v5m24-5v5m-16-3v2m8-2v2m-7 4h6"/></svg>';
  const normalize = text => String(text).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase();

  function publicContext(app) {
    return {
      at: app.state.now,
      hours: app.settings.hours,
      vehicles: E.typesFor(app.state).filter(t => t.active !== false).map(t => ({ id:t.id, label:t.label, price:app.state.rates[t.id], free:E.available(app.state,t.id), capacity:Number(app.state.capacity[t.id])||0, requiresPlate:t.requiresPlate }))
    };
  }
  function reply(app, question) {
    const q = normalize(question);
    const context = publicContext(app);
    const customer = app.ui.role === 'customer';
    if (app.ui.role === 'staff' && A.financialQuestion(question)) return 'Nhân viên chỉ xem lưu lượng và chỗ trống. Báo cáo thu dành cho Manager và Admin.';
    const privateQuestion = /doanh thu|bao cao thu|tong thu|thu chi|so tien thu|da thu|nhan su|nhan vien|tai khoan|khach hang|lich su xe|danh sach xe|tong quan|xe trong bai|xe dang gui|so luot|cao diem|gio dong/.test(q);
    if (customer && privateQuestion) return 'Mình có thể giúp bạn về giá gửi xe, chỗ còn trống, đặt trước và cách thanh toán. Báo cáo thu, thông tin nhân viên và hoạt động nội bộ chỉ dành cho quản lý bãi.';
    const analysis = () => A.generate(app.state, { kind: /nhan su|chia ca|bo tri nhan vien/.test(q) ? 'staff' : 'question',
      period: /tuan|7 ngay/.test(q) ? 'week' : 'day', anchorDate: A.day(app.state.now), question, role: app.ui.role }).text;
    if (!customer && (A.financialQuestion(q) || /bao cao|luu luong|cao diem|dong nhat|nhan su|chia ca|bo tri nhan vien|tong quan|luot vao|luot ra/.test(q))) return analysis();
    let requested = context.vehicles;
    const named = context.vehicles.filter(t=>q.includes(normalize(t.label)));
    if (named.length) requested = named.filter(t=>!named.some(other=>other.id!==t.id && normalize(other.label).includes(normalize(t.label))));
    else if (/xe dap dien/.test(q)) requested = requested.filter(t=>t.id==='ebike');
    else if (/xe dap/.test(q)) requested = requested.filter(t=>t.id==='bicycle');
    else if (/xe may/.test(q)) requested = requested.filter(t=>t.id==='motorbike');
    else if (/o to|xe hoi/.test(q)) requested = requested.filter(t=>t.id==='car');
    if (/\bgia\b|bang phi|phi gui|bao nhieu tien|tinh phi/.test(q)) {
      if (!requested.length) return 'Chưa có loại xe phù hợp trong bảng giá mẫu. Bạn có thể hỏi “Bảng giá gửi xe” để xem các loại bãi đang phục vụ.';
      return 'Bảng giá mẫu hiện tại:\n' + requested.map(t=>`${t.label}: ${app.money(t.price)}/giờ.`).join('\n') + '\n\nTính tròn mỗi giờ đã bắt đầu, tối thiểu một giờ. Lượt đang gửi giữ bảng giá lúc vào; tra phí để xem số tiền chính xác của lượt đó.';
    }
    if (/cho trong|con.*cho|suc chua|cho khong|bai.*trong/.test(q) && !/dat cho|giu cho|dat truoc/.test(q)) {
      if (!requested.length) return 'Chưa có loại xe phù hợp trong dữ liệu mẫu. Bạn có thể hỏi “Còn chỗ không?” để xem toàn bãi.';
      return `Chỗ có thể nhận xe lúc ${app.time(context.at)} (giờ demo):\n` + requested.map(t=>t.capacity ? `${t.label}: còn ${t.free}/${t.capacity} chỗ.` : `${t.label}: chưa có vị trí được cấu hình, hiện chưa nhận xe.`).join('\n') + '\n\nĐã trừ các vị trí đang có xe và chỗ được giữ trước.' + (requested.some(t=>t.free>0) ? ' Bạn có thể đến gửi trực tiếp nếu còn vị trí phù hợp.' : customer ? ' Hiện chưa có chỗ nhận các loại xe này.' : ' Vào Bãi đỗ để kiểm tra hoặc thêm vị trí phù hợp.');
    }
    if (/dat cho|dat ve|giu cho|dat truoc/.test(q)) return 'Vào “Đặt chỗ trước”, chọn loại xe và giờ đến/về dự kiến. Xe có biển số thì nhập biển số; xe đạp không có biển số sẽ được cấp mã xe. Không thu tiền đặt trước; chỉ tính phí từ lúc xe thực sự vào. Giữ chỗ đến 15 phút sau giờ hẹn. Bạn cũng có thể đến gửi trực tiếp, không bắt buộc đặt chỗ.';
    if (/thanh toan|ma ve|qr|mat ve/.test(q)) return 'Mở “Phí gửi xe”, chọn đúng loại xe và nhập biển số hoặc mã xe/mã vé. Nếu lượt chưa liên kết, xác nhận bằng mã trên vé, rồi chọn thanh toán. QR và kết quả thanh toán trong demo này chỉ là mô phỏng. Nếu mất vé, gửi yêu cầu trong mục Hỗ trợ.';
    if (/gio mo|mo cua|dong cua/.test(q)) return `Giờ mở cửa mẫu: ${context.hours}. Bạn có thể hỏi thêm giá gửi xe hoặc chỗ còn trống.`;
    if (!customer) {
      if (/tai khoan/.test(q) && app.ui.role==='admin') return `Trong demo có ${app.users.length} tài khoản mẫu, ${app.users.filter(u=>u.active).length} đang hoạt động. Vào “Tài khoản” để quản lý vai trò và trạng thái. Không có thông tin đăng nhập thật trong bản thử.`;
      return analysis();
    }
    return 'Mình hỗ trợ bạn tra bảng giá, chỗ còn trống, giờ mở cửa, cách đặt trước và thanh toán. Bạn thử hỏi “Giá gửi xe đạp?” hoặc “Còn chỗ ô tô không?” nhé. Câu trả lời đang dùng dữ liệu mẫu của demo.';
  }
  function render(app) {
    const role=app.ui.role;
    const customer=role==='customer';
    const questions=customer?['Giá gửi xe','Còn chỗ không?','Đặt chỗ thế nào?']:['Lưu lượng hôm nay','Cao điểm tuần này','Gợi ý nhân sự'];
    const messages=histories[role];
    const greeting=customer?'Chào bạn! Mình giúp bạn xem giá, tìm chỗ trống và hướng dẫn đặt trước.':'Chào bạn! Mình có thể tóm tắt lưu lượng ngày/tuần, chỗ trống và gợi ý khung trực từ số liệu DEMO.';
    return `<div class="chat-widget">${open?`<section class="chat-window" role="dialog" aria-modal="false" aria-labelledby="chat-title"><header class="chat-header"><div class="chat-avatar">${robot}</div><div><h2 id="chat-title">Trợ lý ParkingAI</h2><p>${customer?'Hỗ trợ khách hàng':'Trợ lý quản lý bãi'} · ${app.esc(role==='admin'?'Admin':role==='manager'?'Manager':role==='staff'?'Staff':'Customer')}</p></div><button type="button" class="chat-close" data-action="chat-close" aria-label="Thu gọn chatbot">${app.icon('close')}</button></header><div class="chat-disclaimer">Demo trả lời theo dữ liệu mẫu · Chưa kết nối AI thật</div><div class="chat-messages" role="log" aria-live="polite" aria-relevant="additions text"><div class="bubble assistant">${app.esc(greeting)}</div>${messages.map(m=>`<div class="bubble ${m.role}"><span class="sr-only">${m.role==='user'?'Bạn':'Trợ lý'}: </span>${app.esc(m.text)}</div>`).join('')}</div><div class="chat-suggestions">${questions.map(q=>`<button type="button" data-action="chat-suggest" data-question="${app.esc(q)}">${app.esc(q)}</button>`).join('')}</div><form data-action="chat-send" class="chat-compose"><label class="sr-only" for="chat-input">Câu hỏi cho trợ lý ParkingAI</label><textarea id="chat-input" name="question" rows="1" maxlength="600" placeholder="Nhập câu hỏi…" required>${app.esc(drafts[role])}</textarea><button type="submit" aria-label="Gửi câu hỏi">${app.icon('arrow')}</button></form></section>`:''}<button type="button" class="chat-launcher ${open?'is-open':''}" data-action="${open?'chat-close':'chat-open'}" aria-expanded="${open}" aria-label="${open?'Thu gọn chatbot':'Mở chatbot ParkingAI'}">${open?app.icon('close'):robot}</button>${!open?'<span class="chat-launcher-label">Hỏi ParkingAI</span>':''}</div>`;
  }
  function focusInput() { requestAnimationFrame(()=>{document.getElementById('chat-input')?.focus();const messages=document.querySelector('.chat-messages');if(messages)messages.scrollTop=messages.scrollHeight;}); }
  function refresh(app) { const mount=document.getElementById('chat-mount'); if(mount)mount.innerHTML=render(app); }
  function handle(app,action,data) {
    if(!action.startsWith('chat-'))return false;
    if(action==='chat-open'){open=true;refresh(app);focusInput();return true;}
    if(action==='chat-close'){open=false;refresh(app);document.querySelector('.chat-launcher')?.focus();return true;}
    const question=String(action==='chat-suggest'?data.question:data.get('question')||'').trim().slice(0,600);
    if(!question)return true;
    histories[app.ui.role].push({role:'user',text:question},{role:'assistant',text:reply(app,question)});
    if(histories[app.ui.role].length>30)histories[app.ui.role].splice(0,2);
    drafts[app.ui.role]='';open=true;refresh(app);focusInput();return true;
  }
  document.addEventListener('input',e=>{if(e.target.id==='chat-input')drafts[window.ParkingDemo.ui.role]=e.target.value;});
  document.addEventListener('keydown',e=>{if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();e.target.form.requestSubmit();}if(e.key==='Escape'&&open&&!document.querySelector('.modal'))handle(window.ParkingDemo,'chat-close',{});});
  window.DemoChat={render,handle,reply,reset(){for(const role of Object.keys(histories)){histories[role]=[];drafts[role]='';}open=false;}};
})();
</script>

  function slotsArt(){return `<svg viewBox="0 0 440 210" role="img" aria-label="Minh họa bãi đỗ xe mẫu"><rect x="12" y="16" width="416" height="180" rx="14" fill="#eaf1f8"/><path d="M12 107h416" stroke="#fff" stroke-width="45"/><path d="M22 107h396" stroke="#b2c6d9" stroke-dasharray="9 10"/><g stroke="#c0d1e1" fill="none" stroke-width="2">${[55,120,185,250,315,380].map(x=>`<path d="M${x} 28v50m0 59v47"/>`).join('')}</g>${[[73,28,'#3e80be'],[203,28,'#a6c0d9'],[333,28,'#417cad'],[138,133,'#97b5cc'],[268,133,'#2f71ad']].map(([x,y,c])=>`<g transform="translate(${x} ${y})"><rect width="31" height="50" rx="9" fill="${c}"/><path d="M5 10h21l-2 8H7ZM7 35h17l2 7H5Z" fill="#e4eff9"/><path d="M2 17v15m27-15v15" stroke="#182f452f" stroke-width="2"/></g>`).join('')}<path d="m210 101 8 6-8 6m8-6h-17" stroke="#88a9c5" stroke-width="2" fill="none"/></svg>`;}
  function availability(){return `<section class="surface availability-panel"><div class="section-head"><h2>Còn chỗ cho chuyến đi của bạn</h2></div><div class="parking-illustration">${slotsArt()}</div>${E.typesFor(app.state).map(v=>v.id).map(t=>`<div class="capacity-row"><span>${esc(E.typeLabel(t,app.state))}</span><span><strong>${E.available(app.state,t)}</strong> / ${app.state.capacity[t]} chỗ nhận xe</span></div><div class="capacity-meter"><div class="capacity-fill" style="width:${E.available(app.state,t)/Math.max(1,app.state.capacity[t])*100}%"></div></div>`).join('')}<p>Bạn có thể đến gửi trực tiếp. Đặt trước khi muốn giữ sẵn một chỗ phù hợp.</p>${btn('goto-booking','Đặt chỗ trước '+icon('arrow'),'quiet')}</section>`;}

  function customerFees(){const s=lookup();return `${head('Tra phí & thanh toán','Xem thời gian gửi và thanh toán trước khi lấy xe.')}<div class="content-grid"><div><section class="surface"><div class="section-head"><h2>Xe của bạn</h2>${icon('car')}</div><form data-action="customer-lookup"><div class="field"><label for="customer-plate">${identifierLabel(app.ui.vehicleType)}</label><input id="customer-plate" name="plate" value="${esc(app.ui.plate)}" placeholder="Ví dụ: 59A-123.45" maxlength="20" required autocomplete="off"></div><div class="field"><label for="customer-type">Loại xe</label><select id="customer-type" name="vehicleType">${typeOptions(app.ui.vehicleType)}</select></div><button class="button primary full" type="submit">${icon('search')} Tra phí gửi xe</button></form><p class="muted" style="font-size:12px;margin-top:16px">Xe mẫu: ${btn('sample-owned','59A-123.45','quiet small')} ${btn('sample-ticket','59B1-678.90','quiet small')} ${btn('sample-bicycle','XD-001 · Xe đạp','quiet small')}</p></section>${app.ui.searched ? s&&canRead(s)?`<section class="surface fee-panel">${summary(s)}${E.quote(app.state,s).due?btn('open-pay','Thanh toán online '+icon('arrow'),'primary full',`data-id="${s.id}"`):`<div class="receipt-success">${icon('check')}Đã thanh toán phí hiện tại. Bạn có thể đến cổng lấy xe.</div><p class="muted" style="font-size:12px">Phí sẽ được kiểm tra lại khi xe ra nếu bạn gửi thêm thời gian.</p>`}</section>`:s?`<section class="surface"><h2>Xác nhận lượt gửi của bạn</h2><p class="muted" style="font-size:13px;margin-top:8px">Nhập mã trên vé để xem phí của lượt này. Không cần đăng ký sở hữu xe.</p><form data-action="claim" style="margin-top:18px"><div class="field"><label for="ticket">Mã vé</label><input id="ticket" name="ticket" placeholder="Mã vé mẫu: VE-4096" required></div><button class="button primary" type="submit">Xác nhận vé</button></form></section>`:`<section class="surface empty">${icon('search')}Chưa tìm thấy lượt gửi phù hợp. Kiểm tra biển s   function bookingList(readonly=false){const rows=app.state.reservations;return rows.length?rows.map(r=>`<div class="booking-row"><div><div class="plate">${esc(r.plate)}</div><p>${esc(E.typeLabel(r.vehicleType,app.state))} · ${time(r.start)} – ${time(r.end)} · ${date(r.start)}</p><p>${esc(r.slot||'Vị trí phù hợp sẽ được giữ')}</p></div><div><span class="badge ${r.status==='confirmed'?'success':'neutral'}">${({confirmed:'Đã giữ chỗ',arrived:'Đã vào bãi',cancelled:'Đã hủy',expired:'Hết hạn'})[r.status]||esc(r.status)}</span>${!readonly&&r.status==='confirmed'?btn('cancel-booking','Hủy','quiet small',`data-id="${r.id}"`):''}</div></div>`).join(''):`<div class="empty">${icon('calendar')}Chưa có đặt chỗ. Bạn vẫn có thể đến gửi trực tiếp.</div>`;}

  function managerOperations(){const s=app.state.sessions.find(x=>x.id===app.ui.selected);return `${head('Vận hành bãi','Nhận xe, kiểm tra phí và xử lý xe ra tại một nơi.',`<div class="segments"><button data-action="mode" data-value="manual" class="${app.ui.mode==='manual'?'active':''}">${icon('car')} Nhập tay</button><button data-action="mode" data-value="camera" class="${app.ui.mode==='camera'?'active':''}">${icon('camera')} Camera</button></div>`)}<div class="stat-strip"><span class="stat-item"><strong>${app.state.sessions.filter(s=>s.status==='active').length}</strong> xe đang gửi</span>${E.typesFor(app.state).map(t=>`<span class="stat-item"><strong>${E.available(app.state,t.id)}</strong> chỗ ${esc(t.label.toLowerCase())}</span>`).join('')}<span class="stat-item">${icon('clock').replace('<svg','<svg style="display:inline-block;width:14px;height:14px;vertical-align:middle"')} ${time(app.state.now)} · giờ demo</span></div><div class="content-grid"><section class="surface"><div class="toolbar"><h2>${app.ui.mode==='manual'?'Nhập thông tin xe':'Nhận diện tự động'}</h2><div class="segments"><button data-action="direction" data-value="entry" class="${app.ui.direction==='entry'?'active':''}">Xe vào</button><button data-action="direction" data-value="exit" class="${app.ui.direction==='exit'?'active':''}">Xe ra</button></div></div>${app.ui.mode==='camera'?`${cameraScene()}<div class="camera-controls">${btn('camera-toggle',app.ui.cameraOn?'Dừng camera':'Bật tự động',app.ui.cameraOn?'secondary':'primary')}${app.ui.cameraOn?btn('camera-simulate','Mô phỏng xe đến làn','secondary'):''}</div><p class="muted" style="font-size:12px;margin-top:16px">Demo mô phỏng nhận diện biển số và loại xe, chưa sử dụng webcam. Xe đủ điều kiện sẽ tự được ghi nhận.</p>`:`<form data-action="${app.ui.direction==='entry'?'checkin':'manager-lookup'}"><div class="field"><label for="operation-plate">${app.ui.direction==='entry'?'Biển số xe':'Biển số / mã xe / mã vé'}</label><input id="operation-plate" name="plate" placeholder="Ví dụ: 51K-246.80" required maxlength="20" autocomplete="off"></div>${app.ui.direction==='entry'?`<div class="field"><label for="operation-type">Loại xe</label><select id="operation-type" name="vehicleType">${typeOptions('car')}</select></div><div class="inline-note">Tự chọn vị trí phù hợp. Xe có thể vào mà không cần đặt trước.</div>`:''}<button class="button primary full" type="submit">${app.ui.direction==='entry'?'Ghi nhận xe vào':'Tra phí & xử lý xe ra'} ${icon('arrow')}</button></form>`}</section><section class="surface fee-panel">${s?`${summary(s)}<div class="fee-line" style="margin-top:12px"><span>Vị trí đỗ</span><span>${esc(s.slot)}</span></div>${s.status==='closed'?'<div class="receipt-success">Lượt gửi đã kết thúc. Vị trí đã được giải phóng.</div>':`<div class="form-actions">${E.quote(app.state,s).due?`${btn('open-pay','Tạo QR cho khách','primary',`data-id="${s.id}"`)}${btn('cash-pay','Thu tiền mặt','secondary',`data-id="${s.id}"`)}`:btn('checkout','Ghi nhận xe ra '+icon('arrow'),'primary full',`data-id="${s.id}"`)}</div><details class="demo-help"><summary>Xem vé của lượt này</summary><p>Mã vé mẫu: <strong>${esc(s.ticket)}</strong></p><p>Khách dùng mã này để tra phí nếu xe chưa liên kết.</p></details>`}`:`<div class="section-head"><h2>Thông tin lượt gửi</h2></div><div class="empty">${icon('ticket')}Nhập biển số hoặc chọn một xe bên dưới.<br>Phí và thao tác thanh toán sẽ hiện tại đây.</div>`}</section></div>${activeTable()}`;}
  function help(){return `<details class="demo-help"><summary>Cách thử nhanh & đối chiếu đề tài</summary><p>1. Manager: vào Khách & vé để thử vé tháng. 2. Vận hành: nhận xe → xem phí → thu tiền → trả xe. 3. Lịch sử và Báo cáo: đối chiếu dữ liệu vừa tạo, sinh AI theo ngày/tuần.</p><div class="demo-tools">${btn('demo-guide','Đối chiếu yêu cầu đề tài','secondary small')}${btn('sample-owned','Khách: thử xe đã liên kết','secondary small')}${btn('sample-ticket','Khách: thử vé VE-4096','secondary small')}${btn('advance','Tăng thời gian thêm 1 giờ','secondary small')}${btn('auth-quick','Thử quyền Nhân viên','quiet small','data-role="staff"')}${btn('reset','Làm lại dữ liệu mẫu','quiet small')}</div><p>Đồng hồ demo: ${date(app.state.now)}/2026, ${time(app.state.now)}. Tải lại trang sẽ khôi phục dữ liệu mẫu. AI/camera/thanh toán mô phỏng.</p></details>`;}

  function render(){
    const u=app.ui,current=app.users.find(user=>user.id===u.userId);
    if(!u.loggedIn||!current?.active){u.loggedIn=false;document.getElementById('app').innerHTML=window.DemoAuth.render(app);return;}
    u.role=current.role;
    if(u.tab!=='profile'&&!navigation[u.role]?.some(item=>item[0]===u.tab))u.tab=navigation[u.role][0][0];
    const nav=navigation[u.role].map(([id,i,label])=>`${u.role==='admin'&&id==='accounts'?'<div class="nav-label admin-section-label">QUẢN TRỊ</div>':''}<button class="nav-item ${u.tab===id?'active':''}" data-action="nav" data-tab="${id}" ${u.tab===id?'aria-current="page"':''}>${icon(i)}${label}</button>`).join('');
    const content=u.tab==='profile'?window.DemoAuth.profile(app):u.role==='customer'?({fees:customerFees,booking:customerBooking,tickets:customerTickets,support:customerSupport}[u.tab]||customerFees)():({overview:()=>window.DemoReports.overview(app),operations:managerOperations,lot:()=>window.DemoCore.lot(app),customers:()=>window.DemoCore.customers(app),history:()=>window.DemoCore.history(app),finance:()=>window.DemoReports.revenue(app),catalog:()=>window.DemoCore.catalog(app)}[u.tab]||(()=>window.AdminDemo.render(app)))();
    document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand"><svg class="brand-mark" viewBox="0 0 38 40" aria-hidden="true"><rect x="1" y="2" width="35" height="35" rx="10" fill="#1767bd"/><path d="M13 28V11h8a6 6 0 0 1 0 12h-8m0-8h8a2 2 0 0 1 0 4h-8" stroke="white" stroke-width="2.5" fill="none"/></svg><span>ParkingAI<small>Một bãi xe. Mọi thứ rõ ràng.</small></span></div><div class="role-switch" role="group" aria-label="Chọn tác nhân để xem demo">${['customer','manager','admin'].map(role=>`<button data-action="role" data-role="${role}" class="${role===u.role?'active':''}" aria-pressed="${role===u.role}">${icon({customer:'user',manager:'car',admin:'shield'}[role])}${names[role]}</button>`).join('')}</div><div class="top-actions"><button class="icon-button" data-action="auth-profile" aria-label="Tài khoản của tôi">${icon('user')}</button><button class="icon-button" data-action="auth-logout" aria-label="Đăng xuất">${icon('logout')}</button></div></header><div class="demo-banner">Bản xem trước · Dữ liệu mẫu · AI, camera và thanh toán mô phỏng${u.role==='staff'?' · Đang thử quyền Nhân viên':''}</div>${u.role==='customer'?`<nav class="customer-nav" aria-label="Menu khách hàng">${nav}</nav>`:''}<div class="app-shell ${u.role==='customer'?'customer':'internal'}">${u.role!=='customer'?`<aside class="sidebar"><div class="nav-label">${u.role==='admin'?'ĐIỀU HÀNH BÃI':'BÃI TRUNG TÂM'}</div>${nav}<div class="sidebar-bottom"><span class="badge success">Bãi đang hoạt động</span><div class="profile-row"><div class="account-avatar">${esc(current.name.slice(0,1))}</div><div>${esc(current.name)}<br><span>${names[u.role]} · tài khoản mẫu</span></div></div></div></aside>`:''}<main class="main ${u.role==='customer'?'customer-main':''}" id="main-content">${content}${help()}<p class="footer-note">${esc(app.settings.name)} · ${esc(app.settings.hours)}<br>Demo để duyệt giao diện và luồng thao tác trước khi triển khai.</p></main></div><div id="chat-mount">${window.DemoChat.render(app)}</div>`;
  }

  function chooseRole(role,userId){
    const user=app.users.find(row=>(userId?row.id===userId:row.role===role)&&row.active);
    if(!user||!navigation[user.role])return notify('Tài khoản mẫu của vai trò này đang bị khóa.');
    clearTimeout(cameraTimer);closeModal();
    app.ui.cameraOn=false;app.ui.loggedIn=true;app.ui.userId=user.id;app.ui.role=user.role;app.ui.tab=navigation[user.role][0][0];app.ui.selected=null;
    location.hash=user.role;render();window.scrollTo(0,0);
  }
  function exitSession(){
    clearTimeout(cameraTimer);closeModal();app.state.audit.unshift({at:app.state.now,text:'Đăng xuất tài khoản mẫu.'});
    app.ui.cameraOn=false;app.ui.loggedIn=false;app.ui.userId=null;app.ui.loginError=null;location.hash='';render();window.scrollTo(0,0);
  }

  function selectSession(id){app.ui.selected=id;render();}
  function qr(){let cells='';for(let y=0;y<25;y++)for(let x=0;x<25;x++){const finder=(ox,oy)=>x>=ox&&x<ox+7&&y>=oy&&y<oy+7&&(x===ox||x===ox+6||y===oy||y===oy+6||(x>=ox+2&&x<=ox+4&&y>=oy+2&&y<=oy+4));const reserved=(x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16);if(finder(0,0)||finder(18,0)||finder(0,18)||(!reserved&&(x*7+y*13+x*y)%5<2))cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}return `<svg class="qr-demo" viewBox="-2 -2 29 29" role="img" aria-label="Hình QR minh họa, không dùng để chuyển tiền"><rect x="-2" y="-2" width="29" height="29" fill="white"/><g fill="#193552">${cells}</g></svg>`;}
  function showModal(title,body){modalReturnFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="Đóng">${icon('close')}</button></div><div class="modal-body">${body}</div></section></div>`;document.body.style.overflow='hidden';document.querySelector('.modal button')?.focus();}
  function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.style.overflow='';app.ui.modal=null;if(modalReturnFocus?.isConnected)modalReturnFocus.focus();}
  function openPay(id,method='online'){const s=app.state.sessions.find(x=>x.id===id);if(!s||s.status!=='active'||(app.ui.role==='customer'&&!canRead(s)))return notify('Bạn chưa có quyền thanh toán lượt này.');app.ui.modal={id,method};const q=E.quote(app.state,s);showModal(method==='cash'?'Xác nhận thu tiền mặt':'Thanh toán phí gửi xe',`<div class="fee-line"><span>Biển số / mã xe</span><strong class="plate">${esc(s.plate)}</strong></div><div class="fee-total" style="text-align:center;font-size:34px;margin:18px 0">${money(q.due)}</div>${method==='online'?qr():''}<p class="qr-label">${method==='online'?'QR minh họa · Không chuyển tiền thật':'Thao tác thử · Không ghi nhận tiền thật'}</p><div class="inline-note">${method==='online'?'Bấm nút bên dưới để mô phỏng kết quả thanh toán thành công.':'Trong ứng dụng thật, chỉ xác nhận sau khi đã nhận tiền của khách.'}</div><button class="button primary full" data-action="confirm-pay">${method==='online'?'Mô phỏng thanh toán thành công':'Xác nhận đã thu · Demo'}</button>`);}
  function autoExit(id){const s=app.state.sessions.find(x=>x.id===id);if(['admin','manager','staff'].includes(app.ui.role)&&app.ui.mode==='camera'&&app.ui.cameraOn&&app.ui.direction==='exit'&&s?.status==='active'&&E.quote(app.state,s).due===0){const r=dispatch({type:'checkout',sessionId:id});app.ui.cameraResult=r.ok?`${s.plate} · Đã tự ghi nhận xe ra`:r.message;render();}}
  function simulateCamera(){if(!app.ui.cameraOn)return;app.ui.cameraResult='Đang nhận diện biển số và loại xe…';render();clearTimeout(cameraTimer);cameraTimer=setTimeout(()=>{if(!app.ui.cameraOn)return;if(app.ui.direction==='entry'){let plate='51K-246.80';if(app.state.sessions.some(s=>E.normalize(s.plate)===E.normalize(plate)&&s.status==='active')){app.ui.cameraResult=plate+' · Xe đã được ghi nhận';render();return;}const r=dispatch({type:'checkin',plate,vehicleType:'car',source:'camera'});if(r.ok)app.ui.selected=r.sessionId;app.ui.cameraResult=r.ok?plate+' · Ô tô · Đã tự ghi nhận vào':r.message;render();}else{const s=app.state.sessions.find(s=>E.normalize(s.plate)===E.normalize('59A-123.45')&&s.status==='active');if(!s){app.ui.cameraResult='59A-123.45 · Không có lượt đang gửi';render();return;}app.ui.selected=s.id;const q=E.quote(app.state,s);app.ui.cameraResult=q.due?`${s.plate} · Chờ thanh toán ${money(q.due)}`:`${s.plate} · Đã thanh toán`;render();autoExit(s.id);}},1000);}
  document.addEventListener('change',event=>{
    if(event.target.id==='slot-type'){app.ui.slotType=event.target.value;document.getElementById('slot-code').value=E.nextSlotCode(app.state,event.target.value);return;}
    const map={'customer-type':['customer-plate','Mã xe / mã vé'], 'book-type':['book-plate','Mã xe (nếu có)'], 'operation-type':['operation-plate','Mã xe (nếu có)']};
    const pair=map[event.target.id];if(!pair)return;
    const unplated=E.typeInfo(event.target.value,app.state)?.requiresPlate===false;
    const input=document.getElementById(pair[0]);if(!input)return;
    document.querySelector(`label[for="${pair[0]}"]`).textContent=unplated?pair[1]:'Biển số xe';
    input.required=event.target.id==='customer-type'||!unplated;
    input.placeholder=unplated?(event.target.id==='customer-type'?'Ví dụ: XD-001 hoặc mã trên vé':'Để trống để hệ thống cấp mã xe'):'Ví dụ: 59A-123.45';
  });
  function allowed(action){
    if(action==='demo-guide'||action==='close-modal'||action.startsWith('auth-'))return true;
    if(!app.ui.loggedIn)return false;
    if(action.startsWith('admin-'))return app.ui.role==='admin';
    if(['checkin','manager-lookup','select-session','checkout','mode','direction','camera-toggle','camera-simulate','cash-pay'].includes(action))return ['admin','manager','staff'].includes(app.ui.role);
    if(['reserve','cancel-booking','claim'].includes(action))return app.ui.role==='customer';
    return true;
  }
  document.addEventListener('submit',event=>{
    const form=event.target.closest('form[data-action]');if(!form)return;event.preventDefault();
    const d=new FormData(form),action=form.dataset.action;
    if(!allowed(action))return notify('Vai trò hiện tại không có quyền thao tác này.');
    if(action.startsWith('auth-'))return window.DemoAuth.handle(app,action,d);
    if(action.startsWith('core-'))return window.DemoCore.handle(app,action,d);
    if(action.startsWith('chat-'))return window.DemoChat.handle(app,action,d);
    if(action.startsWith('report-'))return window.DemoReports.handle(app,action,d);
    if(action.startsWith('admin-')||action.startsWith('catalog-'))return window.AdminDemo.handle(app,action,d);
    if(action==='customer-lookup'){app.ui.plate=String(d.get('plate')).trim().toUpperCase();app.ui.vehicleType=d.get('vehicleType');app.ui.searched=true;render();}
    else if(action==='claim')dispatch({type:'claim',plate:app.ui.plate,vehicleType:app.ui.vehicleType,ticket:String(d.get('ticket')).trim().toUpperCase()});
    else if(action==='reserve')dispatch({type:'reserve',plate:d.get('plate'),vehicleType:d.get('vehicleType'),start:new Date(d.get('start')+'+07:00').toISOString(),end:new Date(d.get('end')+'+07:00').toISOString()});
    else if(action==='checkin'){
      const r=E.apply(app.state,{type:'checkin',role:app.ui.role,plate:d.get('plate'),vehicleType:d.get('vehicleType'),source:'manual'});
      if(r.ok){app.state=r.state;app.ui.selected=r.sessionId;render();}notify(r.message);
    }else if(action==='manager-lookup'){
      const s=app.state.sessions.find(s=>s.status==='active'&&(E.normalize(s.plate)===E.normalize(d.get('plate'))||E.normalize(s.ticket)===E.normalize(d.get('plate'))));
      if(s)selectSession(s.id);else notify('Không tìm thấy lượt đang gửi. Xem Lịch sử để tra toàn bộ lượt.');
    }else if(action==='support')dispatch({type:'support',subject:d.get('subject'),message:d.get('message')});
  });
  document.addEventListener('click',event=>{
    const b=event.target.closest('[data-action]');if(!b||b.closest('form')&&b.type==='submit')return;
    const a=b.dataset.action;
    if(!allowed(a))return notify('Vai trò hiện tại không có quyền thao tác này.');
    if(a==='demo-guide')return window.DemoGuide.show(app);
    if(a.startsWith('auth-'))return window.DemoAuth.handle(app,a,b.dataset);
    if(a.startsWith('core-'))return window.DemoCore.handle(app,a,b.dataset);
    if(a.startsWith('chat-'))return window.DemoChat.handle(app,a,b.dataset);
    if(a.startsWith('report-'))return window.DemoReports.handle(app,a,b.dataset);
    if(a.startsWith('admin-')||a.startsWith('catalog-'))return window.AdminDemo.handle(app,a,b.dataset);
    if(a==='role')return chooseRole(b.dataset.role);
    if(a==='nav'||a==='open-tab'){
      if(navigation[app.ui.role].some(n=>n[0]===b.dataset.tab)){app.ui.tab=b.dataset.tab;render();window.scrollTo(0,0);}return;
    }
    if(a==='reset'){
      const role=app.ui.role;window.DemoChat.reset();clearTimeout(cameraTimer);app.state=E.seed();app.users=seedUsers();
      app.settings={name:'ParkingAI · Bãi trung tâm',hours:'00:00 – 24:00'};
      app.ui={role,loggedIn:true,userId:app.users.find(u=>u.role===role).id,tab:navigation[role][0][0],plate:'59A-123.45',vehicleType:'car',searched:false,mode:'manual',direction:'entry',selected:null,modal:null,cameraOn:false,cameraResult:null};
      closeModal();render();notify('Đã khôi phục dữ liệu mẫu.');
    }else if(a==='goto-booking'){app.ui.tab='booking';render();window.scrollTo(0,0);}
    else if(a==='sample-owned'||a==='sample-ticket'||a==='sample-bicycle'){
      chooseRole('customer');app.ui.plate=a==='sample-owned'?'59A-123.45':a==='sample-bicycle'?'XD-001':'59B1-678.90';app.ui.vehicleType=a==='sample-owned'?'car':a==='sample-bicycle'?'bicycle':'motorbike';app.ui.searched=true;render();
    }else if(a==='cancel-booking')dispatch({type:'cancel-reservation',id:b.dataset.id});
    else if(a==='mode'){clearTimeout(cameraTimer);app.ui.mode=b.dataset.value;app.ui.cameraOn=false;app.ui.cameraResult=null;render();}
    else if(a==='direction'){clearTimeout(cameraTimer);app.ui.direction=b.dataset.value;app.ui.cameraResult=null;render();}
    else if(a==='select-session')selectSession(b.dataset.id);
    else if(a==='open-pay'||a==='cash-pay')openPay(b.dataset.id,a==='cash-pay'?'cash':'online');
    else if(a==='close-modal')closeModal();
    else if(a==='confirm-pay'){
      const modal=app.ui.modal;if(!modal)return;const role=app.ui.role,previous=new Set(app.state.transactions.map(t=>t.id));
      const r=E.apply(app.state,{type:'pay',role,sessionId:modal.id,method:modal.method});
      if(r.ok){app.state=r.state;if(role==='customer')app.ui.customerPayments=[...(app.ui.customerPayments||[]),...r.state.transactions.filter(t=>!previous.has(t.id)).map(t=>t.id)];}
      closeModal();render();notify(r.message);if(r.ok)autoExit(modal.id);
    }else if(a==='checkout')dispatch({type:'checkout',sessionId:b.dataset.id});
    else if(a==='camera-toggle'){clearTimeout(cameraTimer);app.ui.cameraOn=!app.ui.cameraOn;app.ui.cameraResult=null;render();}
    else if(a==='camera-simulate')simulateCamera();
    else if(a==='advance')dispatch({type:'advance',minutes:60});
  });
  document.addEventListener('keydown',event=>{const modal=document.querySelector('.modal');if(!modal)return;if(event.key==='Escape')closeModal();if(event.key==='Tab'){const nodes=[...modal.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled);const first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
  render();
})();
</script>
</body>
</html>
