# fly.toml app configuration file generated for parkingai-api-lam1826 on 2026-08-28T18:45:45+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'parkingai-api-lam1826'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[build.args]
  INSTALL_VISION = "1"

[deploy]
  release_command = "sh -c 'alembic -c alembic.ini upgrade head && python production_release_gate.py'"

[env]
  PORTAL_MAINTENANCE_INTERVAL_SECONDS = "30"
  TRUSTED_EDGE_PROXY = "true"
  PARKINGAI_SHOWCASE_MODE = "true"
  AI_ENABLED = "true"
  GEMINI_MODEL = "gemini-3.6-flash"
  DEMO_PAYMENTS_ENABLED = "true"
  PARKING_VISION_ENGINE = "yolo_rapidocr"
  PARKING_VISION_MODEL = "/opt/parkingai-models/license-plate-yolov8n.onnx"
  PARKING_VISION_MODEL_SHA256 = "85d236280a1301ad98907947d284951dd2b20c23a6786ff50f7e6a8ec515bd50"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '15s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/ready'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
