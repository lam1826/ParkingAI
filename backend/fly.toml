# fly.toml app configuration file generated for parkingai-api-lam1826 on 2026-08-28T18:45:45+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'parkingai-api-lam1826'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'alembic -c alembic.ini upgrade head'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '15s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/ready'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
